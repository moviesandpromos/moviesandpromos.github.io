<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>StockWise — Slide Show</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
    }

    :root {
        --bg: #f7f8fa;
        --surface: #ffffff;
        --text: #1a1d21;
        --text-secondary: #5a6472;
        --muted: #8a94a2;
        --border: #e5e8ec;
        --border-strong: #cbd5e1;
        --accent: #2b6cff;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        --radius: 16px;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f1f5f9;
            --text-secondary: #cbd5e1;
            --muted: #94a3b8;
            --border: #334155;
            --border-strong: #475569;
            --accent: #6ea8ff;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
    }

    html,
    body {
        width: 100%;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont,
                     "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior-y: contain;
    }

    .page {
        width: 100%;
        max-width: 720px;
        margin-left: auto;
        margin-right: auto;
        padding: 16px;
    }

    /* Carousel container */
    .carousel {
        position: relative;
        width: 100%;
        max-width: 688px;
        margin-left: auto;
        margin-right: auto;

        border-radius: var(--radius);
        overflow: hidden;
        background: var(--surface);
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
    }

    /* Slide track */
    .track {
        display: flex;
        width: 100%;
        transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
        will-change: transform;
    }

    /* Individual slide */
    .slide {
        flex: 0 0 100%;
        width: 100%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--surface);
    }

    .slide-media {
        width: 100%;
        height: clamp(220px, 65vh, 620px);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: var(--bg);
    }

    .slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        max-width: 100%;
        max-height: 100%;
        user-select: none;
        -webkit-user-drag: none;
    }

    /* Caption */
    .caption {
        padding: 16px 18px 20px;
        min-height: 120px;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .caption-title {
        font-size: 17px;
        font-weight: 700;
        color: var(--text);
    }

    .caption-text {
        font-size: 14px;
        line-height: 1.5;
        color: var(--text-secondary);
    }

    /* Navigation arrows */
    .arrow {
        position: absolute;
        top: clamp(110px, 32.5vh, 310px);
        transform: translateY(-50%);
        width: 40px;
        height: 40px;
        border-radius: 50%;

        background: rgba(255, 255, 255, 0.9);
        color: #1a1d21;

        border: none;
        font-size: 20px;
        font-weight: 700;

        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        transition: opacity 0.2s ease;

        z-index: 10;
    }

    @media (prefers-color-scheme: dark) {
        .arrow {
            background: rgba(30, 41, 59, 0.9);
            color: #f1f5f9;
        }
    }

    .arrow:disabled {
        opacity: 0;
        pointer-events: none;
    }

    .arrow-prev {
        left: 12px;
    }

    .arrow-next {
        right: 12px;
    }

    /* Hide arrows on narrow screens; swipe is primary */
    @media (max-width: 599px) {
        .arrow {
            display: none;
        }
    }

    /* Footer */
    .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: var(--surface);
        border-top: 1px solid var(--border);
    }

    /* Navigation dots */
    .dots {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .dot {
        width: 8px;
        height: 8px;
        border-radius: 4px;
        background: var(--border-strong);
        border: none;
        cursor: pointer;
        transition: width 0.2s ease, background 0.2s ease;
        padding: 0;
    }

    .dot.active {
        width: 20px;
        background: var(--accent);
    }

    .counter {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
    }

    /* Small-screen adjustments */
    @media (max-width: 599px) {
        .page {
            padding: 10px;
        }

        .slide-media {
            height: clamp(220px, 60vh, 520px);
        }

        .caption {
            padding: 14px 16px 18px;
        }
    }
</style>
</head>

<body>

<div class="page">

    <div class="carousel"
         role="region"
         aria-roledescription="carousel"
         aria-label="Slide show">

        <button class="arrow arrow-prev"
                aria-label="Previous slide"
                disabled>
            &#10094;
        </button>

        <button class="arrow arrow-next"
                aria-label="Next slide">
            &#10095;
        </button>

        <div class="track" id="track">
            <!-- Slides injected by JavaScript -->
        </div>

        <div class="footer">

            <div class="dots"
                 id="dots"
                 role="tablist">
            </div>

            <div class="counter" id="counter">
                1 / 8
            </div>

        </div>

    </div>

</div>

<script>

(function () {

    // ── Slide data ──

    const slides = [
        {
            image: 'https://stocksnmore.com/slide1.jpeg',
            title: 'Make Smarter Stock Market Decisions',
            description: 'StockWise brings powerful stock analysis tools, historical market data and AI-assisted insights together to help you understand market trends, evaluate opportunities and make more informed investment decisions.'
        },
        {
            image: 'https://stocksnmore.com/slide2.jpeg',
            title: 'AI-Powered Stock Analysis, Your Way',
            description: 'Generate detailed technical and fundamental data for your selected stocks. Simply copy the data into ChatGPT or your preferred AI tool to analyse stocks, identify trends and explore potential opportunities.'
        },
        {
            image: 'https://stocksnmore.com/slide3.jpeg',
            title: 'AI-Powered Index Analysis',
            description: 'Generate comprehensive historical market data and technical indicators for indices such as NIFTY and BANK NIFTY. Copy the data into ChatGPT or your preferred AI tool to analyse market trends, evaluate historical patterns and explore potential market scenarios.'
        },
        {
            image: 'https://stocksnmore.com/slide4.jpeg',
            title: 'What Happened the Last Time?',
            description: 'Discover how a stock performed in the past when similar technical indicator conditions occurred. View its forward performance over the next 5, 10, 20, 30 and 60 trading days to understand historical patterns and evaluate possible outcomes.'
        },
        {
            image: 'https://stocksnmore.com/slide5.jpeg',
            title: 'Backtest Your Stock Trading Strategies',
            description: 'Test your trading strategies against historical stock market data. Evaluate returns, winning trades, drawdowns and other key performance metrics to understand how your strategy would have performed in the past — before putting real money at risk.'
        },
        {
            image: 'https://stocksnmore.com/slide6.jpeg',
            title: 'More Ways to Test Your Strategies',
            description: 'Go beyond basic stock backtesting. Test strategies on market indices, use Walkforward Analysis to evaluate their consistency across different market periods, and run Monte Carlo simulations to explore a range of possible outcomes.'
        },
        {
            image: 'https://stocksnmore.com/slide8.jpeg',
            title: 'One Goal. Two Powerful Approaches.',
            description: 'Whether you use AI Setup to explore market data or Backtesting to evaluate trading strategies, StockWise brings both approaches together to help you make more informed, data-driven stock market decisions.'
        },
        {
            image: 'https://stocksnmore.com/slide9.jpeg',
            title: 'StockWise for Every Investor',
            description: 'Whether you\'re a beginner taking your first steps in the stock market, an active trader refining strategies, or a systematic investor testing data-driven approaches, StockWise offers tools to support your journey.'
        }
    ];


    const track = document.getElementById('track');
    const dotsBox = document.getElementById('dots');
    const counter = document.getElementById('counter');

    const btnPrev = document.querySelector('.arrow-prev');
    const btnNext = document.querySelector('.arrow-next');

    let index = 0;

    let startX = 0;
    let startY = 0;

    let dragging = false;


    // ── Build slides and dots ──

    slides.forEach((s, i) => {

        const slide = document.createElement('div');

        slide.className = 'slide';

        slide.setAttribute('role', 'group');
        slide.setAttribute('aria-roledescription', 'slide');
        slide.setAttribute('aria-label',
            `${i + 1} of ${slides.length}`);


        // Image area

        const media = document.createElement('div');

        media.className = 'slide-media';


        const img = document.createElement('img');

        img.src = s.image;
        img.alt = s.title || `Slide ${i + 1}`;

        img.loading = i === 0 ? 'eager' : 'lazy';

        img.draggable = false;


        media.appendChild(img);


        // Caption

        const caption = document.createElement('div');

        caption.className = 'caption';


        if (s.title) {

            const t = document.createElement('div');

            t.className = 'caption-title';
            t.textContent = s.title;

            caption.appendChild(t);
        }


        const d = document.createElement('div');

        d.className = 'caption-text';
        d.textContent = s.description || ' ';

        caption.appendChild(d);


        slide.appendChild(media);
        slide.appendChild(caption);

        track.appendChild(slide);


        // Navigation dot

        const dot = document.createElement('button');

        dot.className = 'dot' + (i === 0 ? ' active' : '');

        dot.setAttribute('role', 'tab');
        dot.setAttribute('aria-label',
            `Go to slide ${i + 1}`);

        dot.addEventListener('click', () => goTo(i));

        dotsBox.appendChild(dot);

    });


    // ── Go to slide ──

    function goTo(i) {

        index = Math.max(0, Math.min(i, slides.length - 1));

        track.style.transform =
            `translateX(-${index * 100}%)`;


        document.querySelectorAll('.dot').forEach((d, k) => {

            d.classList.toggle('active', k === index);

        });


        counter.textContent =
            `${index + 1} / ${slides.length}`;


        btnPrev.disabled = index === 0;

        btnNext.disabled = index === slides.length - 1;

    }


    // ── Arrow navigation ──

    btnPrev.addEventListener('click', () => {

        goTo(index - 1);

    });


    btnNext.addEventListener('click', () => {

        goTo(index + 1);

    });


    // ── Swipe handling ──

    track.addEventListener('pointerdown', (e) => {

        if (e.pointerType === 'mouse' && e.button !== 0) return;

        dragging = true;

        startX = e.clientX;
        startY = e.clientY;

        track.style.transition = 'none';

        if (track.setPointerCapture) {
            track.setPointerCapture(e.pointerId);
        }

    });


    track.addEventListener('pointermove', (e) => {

        if (!dragging) return;

        const dx = e.clientX - startX;

        const dy = e.clientY - startY;


        if (Math.abs(dy) > Math.abs(dx) + 10) {

            dragging = false;

            track.style.transition = '';

            goTo(index);

            return;
        }


        const pct = (dx / track.offsetWidth) * 100;

        track.style.transform =
            `translateX(${-index * 100 + pct}%)`;

    });


    function endDrag(e) {

        if (!dragging) return;

        dragging = false;

        track.style.transition = '';


        const dx = e.clientX - startX;

        const threshold = track.offsetWidth * 0.15;


        if (dx < -threshold) {

            goTo(index + 1);

        } else if (dx > threshold) {

            goTo(index - 1);

        } else {

            goTo(index);

        }

    }


    track.addEventListener('pointerup', endDrag);

    track.addEventListener('pointercancel', endDrag);


    // ── Keyboard navigation ──

    document.addEventListener('keydown', (e) => {

        if (e.key === 'ArrowLeft') {

            goTo(index - 1);

        } else if (e.key === 'ArrowRight') {

            goTo(index + 1);

        }

    });


    // ── Prevent accidental image dragging ──

    track.addEventListener('dragstart', (e) => {

        e.preventDefault();

    });


    // ── Initialisation ──

    goTo(0);

})();

</script>

</body>
</html>
